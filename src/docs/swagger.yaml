openapi: 3.0.0
info:
  title: CareerHub API
  description: The project aims to design and implement a software product using state-of-the-art tools and technologies in the software industry. The required product should mimic some functionalities of LinkedIn 
  version: 1.0.0

tags:
  - name: Authentication
    description: Endpoints related to user authentication
 
  - name: Profile Management
    description: Endpoints related to managing user profile details

  - name: User Profiles
    description: Endpoints related to user profile management
  
  - name: Work Experience
    description: Endpoints related to user work experience management
    
  - name: Education
    description: Endpoints related to user education management
    
  - name: Privacy Settings
    description: Endpoints related to user privacy management
    
  - name: Skills
    description: Endpoints related to user skills management
    
  - name: Certifications
    description: Endpoints related to user certifications management
  
  - name: Connections
    description: Endpoints for managing user connections.
    
  - name: Following
    description: Endpoints related to following and followers
    
  - name: User Search
    description: Endpoints related to searching users and connection suggestions
    
  - name: Blocking
    description: Endpoints related to blocking and unblocking users
    
  - name: Feed
    description: Endpoints related to user feed and posts 
    
  - name: Posts
    description: Endpoints related to creating and managing posts
    
  - name: Engagement
    description: Endpoints related to liking, sharing, and commenting on posts
  - name: Saved Posts
    description: Endpoints related to saving and unsaving posts
  - name: Comment Engagement
    description: Endpoints related to liking and unliking comments
    
  - name: Conversations
    description: Endpoints related to user messaging and conversations
  
  - name: Messages
    description: Endpoints related to sending, receiving, and managing messages

  - name: Notifications
    description: Endpoints related to notification management
  - name: Job Search
    description: Endpoints related to searching for jobs and saving job postings
  - name: Job Applications
    description: Endpoints related to job applications and saved jobs
  - name: Company
    description: Endpoints related to job postings and application management
  - name: Company Management
    description: Endpoints related to company page management
  - name: Company Engagement
    description: Endpoints related to following and engaging with companies
  - name: Company Content
    description: Endpoints related to posting and managing company updates
  - name: Privacy Controls
    description: Endpoints related to privacy settings and reporting content
  - name: User Management
    description: Endpoints related to managing user accounts and statistics
  - name: Job Management
    description: Endpoints for managing job postings, applications, and statuses.
  - name: Payments
    description: Endpoints for handling premium subscriptions and one-time payments.
  - name: Admin
    description: Endpoints for admin functionalities such as moderation, user management, and content control.
paths:
 
  /api/connections:
    get:
      tags:
        - Connections
      summary: Get User Connections
      description: Retrieves the logged-in user's connections.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of user connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        firstName:
                          type: string
                        lastName:
                          type: string
                        headline:
                          type: string
                  total:
                    type: integer

  # 2. Get Pending Connection Requests
  /api/connections/pending:
    get:
      tags:
        - Connections
      summary: Get Pending Connection Requests
      description: Retrieves the pending connection requests sent to the logged-in user.
      responses:
        '200':
          description: List of pending requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingRequests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        firstName:
                          type: string
                        lastName:
                          type: string
                        headline:
                          type: string

  # 3. Send Connection Request
  /api/connections/users/{userId}:
    post:
      tags:
        - Connections
      summary: Send Connection Request
      description: Sends a connection request to another user.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connection request sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # 4. Accept Connection Request
  /api/connections/{connectionId}/accept:
    put:
      tags:
        - Connections
      summary: Accept Connection Request
      description: Accepts a pending connection request.
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connection request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # 5. Decline Connection Request
  /api/connections/{connectionId}/decline:
    put:
      tags:
        - Connections
      summary: Decline Connection Request
      description: Declines a pending connection request.
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connection request declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # 6. Remove Connection
  /api/connections/{connectionId}:
    delete:
      tags:
        - Connections
      summary: Remove Connection
      description: Removes an existing connection.
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connection removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a New User
      description: Creates a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "200":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates a user and returns tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string
                      email:
                        type: string
  /api/auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh Authentication Token
      description: Refreshes the access token using a refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Invalidates the user's tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/users/me:
    get:
      tags:
        - User Profiles
      summary: Get Current User Profile
      description: Retrieves the logged-in user's profile.
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  firstName:
                    type: string
                  lastName:
                    type: string
                  email:
                    type: string
    put:
      tags:
        - User Profiles
      summary: Update Current User Profile
      description: Updates the logged-in user's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/users/me/update-email:
    patch:
      tags:
        - User Profiles
      summary: Update Email Address
      description: Updates the user's email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newEmail:
                  type: string
      responses:
        "200":
          description: Email update request sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/users/me/update-password:
    patch:
      tags:
        - User Profiles
      summary: Update Password
      description: Changes the user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/users/me/delete-me:
    delete:
      tags:
        - User Profiles
      summary: Delete User Account
      description: Deletes the logged-in user’s account.
      responses:
        "200":
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/profiles/{userId}:
    get:
      tags:
        - Profile Management
      summary: Get User Profile
      description: Retrieves a user's public profile.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  firstName:
                    type: string
                  lastName:
                    type: string
                  headline:
                    type: string
                  location:
                    type: string
                  profilePicture:
                    type: string
  /api/profiles/me/profile-picture:
    post:
      tags:
        - Profile Management
      summary: Upload Profile Picture
      description: Uploads a new profile picture.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Profile picture uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  profilePictureUrl:
                    type: string
    delete:
      tags:
        - Profile Management
      summary: Delete Profile Picture
      description: Deletes the current profile picture.
      responses:
        "200":
          description: Profile picture deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/profiles/me/cover-photo:
    post:
      tags:
        - Profile Management
      summary: Upload Cover Photo
      description: Uploads a new cover photo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Cover photo uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  coverPhotoUrl:
                    type: string
    delete:
      tags:
        - Profile Management
      summary: Delete Cover Photo
      description: Deletes the current cover photo.
      responses:
        "200":
          description: Cover photo deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/profiles/me/resume:
    post:
      tags:
        - Profile Management
      summary: Upload Resume
      description: Uploads a resume file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Resume uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  resumeUrl:
                    type: string
    delete:
      tags:
        - Profile Management
      summary: Delete Resume
      description: Deletes the uploaded resume.
      responses:
        "200":
          description: Resume deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/profiles/me/experience:
    get:
      tags:
        - Work Experience
      summary: Get Work Experience
      description: Retrieves the user's work experiences.
      responses:
        "200":
          description: Work experience retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    company:
                      type: string
                    position:
                      type: string
                    startDate:
                      type: string
                    endDate:
                      type: string
                    location:
                      type: string
                    description:
                      type: string
    post:
      tags:
        - Work Experience
      summary: Add Work Experience
      description: Adds a new work experience entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                position:
                  type: string
                startDate:
                  type: string
                endDate:
                  type: string
                location:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Work experience added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/profiles/me/experience/{experienceId}:
    put:
      tags:
        - Work Experience
      summary: Update Work Experience
      description: Updates an existing work experience.
      parameters:
        - in: path
          name: experienceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                position:
                  type: string
                startDate:
                  type: string
                endDate:
                  type: string
                location:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Work experience updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    delete:
      tags:
        - Work Experience
      summary: Delete Work Experience
      description: Deletes a work experience entry.
      parameters:
        - in: path
          name: experienceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Work experience deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    
  # 1. Get All Job Listings (Admin)
  /api/alljobs:
    get:
      tags:
        - Job Management
      summary: Get All Job Listings
      description: Retrieves all job listings.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, rejected, pending]
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of job postings
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        company:
                          type: string
                        location:
                          type: string
                        status:
                          type: string
                        postedAt:
                          type: string
                          format: date-time
                  total:
                    type: integer

  # 2. Approve or Reject Job Listing (Admin)
  /api/jobs/{jobId}/status:
    put:
      tags:
        - Job Management
      summary: Approve or Reject Job Listing
      description: Updates the status of a job listing.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Approved, Rejected]
      responses:
        '200':
          description: Job status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # 3. Get Job Statistics (Admin)
  /api/admin/analytics/jobs:
    get:
      tags:
        - Admin
      summary: Get Job Statistics
      description: Retrieves job statistics.
      responses:
        '200':
          description: Job statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalJobs:
                    type: integer
                  approvedJobs:
                    type: integer
                  pendingJobs:
                    type: integer
                  rejectedJobs:
                    type: integer
  # 1. Subscribe to Premium
  /api/payments/subscribe:
    post:
      tags:
        - Payments
      summary: Subscribe to Premium
      description: Subscribes the logged-in user to a premium plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                  enum: [monthly, yearly]
                paymentMethodId:
                  type: string
      responses:
        '200':
          description: Subscription successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  subscriptionId:
                    type: string
                  status:
                    type: string
                  renewalDate:
                    type: string
                    format: date-time

  # 2. Get Subscription Details
  /api/payments/subscription:
    get:
      tags:
        - Payments
      summary: Get Subscription Details
      description: Retrieves the details of the logged-in user's current subscription.
      responses:
        '200':
          description: Subscription details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptionId:
                    type: string
                  plan:
                    type: string
                  status:
                    type: string
                  renewalDate:
                    type: string
                    format: date-time
                  amount:
                    type: number
                  currency:
                    type: string

  # 3. Cancel Subscription
  /api/payments/cancel_subscription:
    delete:
      tags:
        - Payments
      summary: Cancel Subscription
      description: Cancels the user's premium subscription.
      responses:
        '200':
          description: Subscription canceled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: string

  # 4. Make a One-Time Payment for Premium
  /api/payments/subscribe/one-time:
    post:
      tags:
        - Payments
      summary: Make a One-Time Payment for Premium
      description: Allows the user to make a one-time payment for premium benefits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                currency:
                  type: string
                paymentMethodId:
                  type: string
      responses:
        '200':
          description: Payment successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  transactionId:
                    type: string
                  status:
                    type: string

  /api/following:
    get:
      tags:
        - Following
      summary: Get Users the Current User is Following
      description: Retrieves the list of users the logged-in user is following.
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    firstName:
                      type: string
                    lastName:
                      type: string
                    headline:
                      type: string
  /api/followers:
    get:
      tags:
        - Following
      summary: Get Users Following the Current User
      description: Retrieves the list of users following the logged-in user.
      responses:
        "200":
          description: Followers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    firstName:
                      type: string
                    lastName:
                      type: string
                    headline:
                      type: string
  /api/following/users/{userId}:
    post:
      tags:
        - Following
      summary: Follow a User
      description: Follows another user.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User followed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    delete:
      tags:
        - Following
      summary: Unfollow a User
      description: Unfollows a user.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User unfollowed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    
  /api/users/blocked:
    get:
      tags:
        - Blocking
      summary: Get Blocked Users
      description: Retrieves the list of users blocked by the logged-in user.
      responses:
        "200":
          description: Blocked users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    firstName:
                      type: string
                    lastName:
                      type: string
                    headline:
                      type: string
                      
  /api/users/{userId}/block:
    post:
      tags:
        - Blocking
      summary: Block a user
      description: Blocks a user, preventing them from sending connection requests or messages.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user to block.
      responses:
        '200':
          description: User blocked successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User blocked successfully."
                  
    delete:
      tags:
        - Blocking
      summary: Unblock a User
      description: Unblocks a previously blocked user.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User unblocked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
 
  /api/search/users:
    get:
      tags:
        - User Search
      summary: Search Users
      description: Searches for users based on name, company, or industry.
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: Search term for user name, company, or industry.
        - in: query
          name: company
          required: false
          schema:
            type: string
          description: Filter by company name.
        - in: query
          name: industry
          required: false
          schema:
            type: string
          description: Filter by industry.
        - in: query
          name: page
          required: false
          schema:
            type: integer
          description: Page number for pagination.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
          description: Number of results per page.
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    firstName:
                      type: string
                    lastName:
                      type: string
